name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# CI never deploys, publishes images, or needs production/repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_DIST_DIR: .next
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type-check
        run: npm run typecheck
      - name: Release smoke harness tests
        run: node --test ../scripts/release_smoke.test.mjs
      - name: Unit and component tests
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Build production bundle
        run: npm run build
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-tests
          path: frontend/test-results/unit.xml
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      # Disposable CI database, never the user's development/production database.
      DATABASE_URL: postgresql+psycopg://unicircle_ci:ci-only-postgres-password@127.0.0.1:5432/unicircle_ci
      CI_TEST_DATABASE_URL: postgresql+psycopg://unicircle_ci:ci-only-postgres-password@127.0.0.1:5432/unicircle_ci
      JWT_SECRET: ci-only-jwt-signing-key-not-used-outside-ci-1234567890
      OTP_PEPPER: ci-only-otp-signing-key-not-used-outside-ci-0987654321
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: unicircle_ci
          POSTGRES_USER: unicircle_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unicircle_ci -d unicircle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-ci.txt
            backend/pyproject.toml
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Lint
        run: ruff check app tests scripts
      - name: Format check
        run: ruff format --check app tests scripts
      - name: Validate curated knowledge files
        run: python -m app.modules.assistant.ingest --check
      - name: Unit and in-process API tests
        run: python -m pytest -m 'not integration' --strict-markers --junitxml=test-results/unit.xml
      - name: Apply migrations to disposable PostgreSQL
        run: python -m alembic upgrade head
      - name: PostgreSQL API integration tests
        run: python -m pytest -m integration --strict-markers --junitxml=test-results/postgres.xml
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-tests
          path: backend/test-results/*.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker (${{ matrix.component }})
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: |
            unicircle-${{ matrix.component }}:ci
            unicircle-${{ matrix.component }}:sha-${{ github.sha }}
          build-args: |
            IMAGE_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          # Fork/PR code never writes the trusted main image-build cache.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.component) || '' }}
      - name: Verify non-root runtime
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          user=$(docker image inspect "unicircle-${COMPONENT}:ci" --format '{{.Config.User}}')
          test -n "$user" && test "$user" != '0' && test "$user" != 'root'
      - name: Verify packaged CUET knowledge
        if: ${{ matrix.component == 'backend' }}
        run: docker run --rm --network none --read-only --entrypoint python unicircle-backend:ci -m app.modules.assistant.ingest --check

  gate:
    name: CI gate
    needs: [frontend, backend, docker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$DOCKER_RESULT" = success
