[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unicircle-backend"
version = "0.1.0"
description = "UniCircle FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "beautifulsoup4>=4.12,<5",
  "langchain-community>=0.4,<1",
  "langchain-ollama>=1,<2",
  "langchain-text-splitters>=1,<2",
  "PyJWT>=2.9,<3",
  "pypdf>=5,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.40,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
cloud = ["fastembed==0.8.1"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

# Vercel's automatic uv installation includes the CPU-only cloud group, while
# the existing Docker requirements.lock remains valid for local Ollama builds.
[dependency-groups]
cloud = ["fastembed==0.8.1"]

[tool.uv]
default-groups = ["cloud"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.directory" = ["cuet_directory.json"]
"app.modules.campus" = ["cuet_campus.json"]
"app.modules.assistant" = ["knowledge/*.md", "knowledge/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: isolated PostgreSQL API tests requiring CI_TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
